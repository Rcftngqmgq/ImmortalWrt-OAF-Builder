name: Build OpenAppFilter for ImmortalWrt x86_64

on:
  workflow_dispatch:
    inputs:
      immortalwrt_version:
        description: '选择 ImmortalWrt 源码版本'
        required: true
        default: 'v25.12.2'
        type: choice
        options:
          - openwrt-25.12
          - v25.12.0
          - v25.12.1
          - v25.12.2
          - v25.12.3
          - v25.12.4
          - v25.12.5
          - v25.12.6

permissions:
  contents: write

env:
  IMMORTALWRT_REPO: https://github.com/immortalwrt/immortalwrt.git
  OAF_REPO: https://github.com/destan19/OpenAppFilter.git

jobs:
  build:
    name: OAF - ${{ inputs.immortalwrt_version }} - x86_64
    runs-on: ubuntu-24.04

    steps:
      # ============================================================
      # Checkout Builder Repository
      # ============================================================

      - name: Checkout
        uses: actions/checkout@v4

      # ============================================================
      # Free disk space
      # ============================================================

      - name: Free disk space
        shell: bash
        run: |
          set -euxo pipefail

          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /opt/hostedtoolcache/CodeQL || true

          df -h

      # ============================================================
      # Build dependencies
      #
      # genisoimage provides mkisofs.
      # ============================================================

      - name: Install build dependencies
        shell: bash
        run: |
          set -euxo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            clang \
            flex \
            bison \
            g++ \
            gawk \
            gcc-multilib \
            g++-multilib \
            gettext \
            git \
            libelf-dev \
            libncurses-dev \
            libssl-dev \
            zlib1g-dev \
            python3 \
            python3-setuptools \
            python3-pyelftools \
            rsync \
            swig \
            unzip \
            file \
            wget \
            curl \
            jq \
            zstd \
            ccache \
            genisoimage \
            qemu-utils \
            dosfstools \
            mtools \
            parted

          echo
          echo "mkisofs:"
          command -v mkisofs
          mkisofs --version || true

      # ============================================================
      # Validate selected ImmortalWrt branch/tag
      # ============================================================

      - name: Validate ImmortalWrt ref
        id: validate_iwrt
        shell: bash
        env:
          IWRT_REF: ${{ inputs.immortalwrt_version }}
        run: |
          set -euxo pipefail

          echo "Selected ImmortalWrt ref: ${IWRT_REF}"

          if [[ "${IWRT_REF}" == v* ]]; then

            echo "Checking ImmortalWrt tag: ${IWRT_REF}"

            if ! git ls-remote \
              --exit-code \
              --tags \
              "${IMMORTALWRT_REPO}" \
              "refs/tags/${IWRT_REF}" \
              >/dev/null 2>&1; then

              echo
              echo "============================================================"
              echo "ERROR: ImmortalWrt tag does not exist:"
              echo "${IWRT_REF}"
              echo "============================================================"
              exit 1
            fi

            RELEASE="${IWRT_REF#v}"

            echo "type=tag" >> "${GITHUB_OUTPUT}"
            echo "release=${RELEASE}" >> "${GITHUB_OUTPUT}"

          else

            echo "Checking ImmortalWrt branch: ${IWRT_REF}"

            if ! git ls-remote \
              --exit-code \
              --heads \
              "${IMMORTALWRT_REPO}" \
              "refs/heads/${IWRT_REF}" \
              >/dev/null 2>&1; then

              echo
              echo "============================================================"
              echo "ERROR: ImmortalWrt branch does not exist:"
              echo "${IWRT_REF}"
              echo "============================================================"
              exit 1
            fi

            echo "type=branch" >> "${GITHUB_OUTPUT}"
            echo "release=${IWRT_REF}" >> "${GITHUB_OUTPUT}"

          fi

          echo
          echo "ImmortalWrt ref is valid."

      # ============================================================
      # Clone ImmortalWrt
      # ============================================================

      - name: Clone ImmortalWrt
        id: iwrt
        shell: bash
        env:
          IWRT_REF: ${{ inputs.immortalwrt_version }}
        run: |
          set -euxo pipefail

          git clone \
            --depth 1 \
            --branch "${IWRT_REF}" \
            "${IMMORTALWRT_REPO}" \
            immortalwrt

          cd immortalwrt

          IWRT_COMMIT="$(git rev-parse HEAD)"
          IWRT_SHORT="$(git rev-parse --short=8 HEAD)"

          echo
          echo "============================================================"
          echo "ImmortalWrt"
          echo "============================================================"
          echo "Ref:    ${IWRT_REF}"
          echo "Commit: ${IWRT_COMMIT}"
          echo "============================================================"

          echo "ref=${IWRT_REF}" >> "${GITHUB_OUTPUT}"
          echo "commit=${IWRT_COMMIT}" >> "${GITHUB_OUTPUT}"
          echo "short_commit=${IWRT_SHORT}" >> "${GITHUB_OUTPUT}"

      # ============================================================
      # Update feeds
      # ============================================================

      - name: Update and install feeds
        shell: bash
        working-directory: immortalwrt
        run: |
          set -euxo pipefail

          ./scripts/feeds update -a
          ./scripts/feeds install -a

      # ============================================================
      # Remove ImmortalWrt built-in OAF
      #
      # ImmortalWrt packages feed already contains:
      #
      #   kmod-oaf
      #   appfilter
      #
      # It conflicts with destan19/OpenAppFilter and causes:
      #
      # recursive dependency detected
      # symbol PACKAGE_kmod-oaf is selected by PACKAGE_kmod-oaf
      # ============================================================

      - name: Remove built-in OpenAppFilter
        shell: bash
        working-directory: immortalwrt
        run: |
          set -euxo pipefail

          echo "Removing ImmortalWrt built-in OpenAppFilter..."

          rm -rf feeds/packages/net/open-app-filter
          rm -rf package/feeds/packages/open-app-filter

          # Old ImmortalWrt LuCI frontend
          rm -rf feeds/luci/applications/luci-app-appfilter
          rm -rf package/feeds/luci/luci-app-appfilter

          # Remove generated package/Kconfig cache
          rm -rf tmp

          echo
          echo "Built-in OpenAppFilter removed."

      # ============================================================
      # Get latest stable OAF tag
      #
      # Examples:
      #
      # v7.0.1
      # v7.0.2
      # v7.1.0
      #
      # master / rc / beta tags are not used.
      # ============================================================

      - name: Resolve latest OpenAppFilter tag
        id: oaf
        shell: bash
        run: |
          set -euxo pipefail

          OAF_TAG="$(
            git ls-remote \
              --tags \
              --refs \
              "${OAF_REPO}" \
              'refs/tags/v*' \
            | sed 's#.*refs/tags/##' \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
            | sort -V \
            | tail -n 1
          )"

          if [ -z "${OAF_TAG}" ]; then
            echo "ERROR: Unable to determine latest OpenAppFilter tag."
            exit 1
          fi

          if ! git ls-remote \
            --exit-code \
            --tags \
            "${OAF_REPO}" \
            "refs/tags/${OAF_TAG}" \
            >/dev/null 2>&1; then

            echo "ERROR: Invalid OpenAppFilter tag: ${OAF_TAG}"
            exit 1
          fi

          echo
          echo "============================================================"
          echo "Latest OpenAppFilter tag: ${OAF_TAG}"
          echo "============================================================"

          echo "tag=${OAF_TAG}" >> "${GITHUB_OUTPUT}"

      # ============================================================
      # Clone OAF latest stable tag
      # ============================================================

      - name: Clone OpenAppFilter
        id: oaf_source
        shell: bash
        working-directory: immortalwrt
        env:
          OAF_TAG: ${{ steps.oaf.outputs.tag }}
        run: |
          set -euxo pipefail

          rm -rf package/OpenAppFilter

          git clone \
            --depth 1 \
            --branch "${OAF_TAG}" \
            "${OAF_REPO}" \
            package/OpenAppFilter

          OAF_COMMIT="$(
            git -C package/OpenAppFilter rev-parse HEAD
          )"

          OAF_SHORT="$(
            git -C package/OpenAppFilter rev-parse --short=8 HEAD
          )"

          APPFILTER_VERSION="$(
            sed -n 's/^PKG_VERSION:=//p' \
            package/OpenAppFilter/open-app-filter/Makefile \
            | head -n 1
          )"

          echo
          echo "============================================================"
          echo "OpenAppFilter"
          echo "============================================================"
          echo "Tag:               ${OAF_TAG}"
          echo "AppFilter version: ${APPFILTER_VERSION}"
          echo "Commit:            ${OAF_COMMIT}"
          echo "============================================================"

          echo "commit=${OAF_COMMIT}" >> "${GITHUB_OUTPUT}"
          echo "short_commit=${OAF_SHORT}" >> "${GITHUB_OUTPUT}"
          echo "version=${APPFILTER_VERSION}" >> "${GITHUB_OUTPUT}"

      # ============================================================
      # Check duplicate package definitions
      #
      # There must be exactly one KernelPackage/oaf and one
      # Package/appfilter after removing ImmortalWrt built-in OAF.
      # ============================================================

      - name: Check OpenAppFilter package conflicts
        shell: bash
        working-directory: immortalwrt
        run: |
          set -euo pipefail

          echo
          echo "Searching KernelPackage/oaf definitions..."
          echo

          KMOD_FILES="$(
            grep -Rsl \
              --include='Makefile' \
              'define KernelPackage/oaf' \
              package feeds \
              2>/dev/null \
              || true
          )"

          printf '%s\n' "${KMOD_FILES}"

          KMOD_COUNT="$(
            printf '%s\n' "${KMOD_FILES}" \
              | sed '/^$/d' \
              | wc -l
          )"

          echo
          echo "KernelPackage/oaf definitions: ${KMOD_COUNT}"

          if [ "${KMOD_COUNT}" -ne 1 ]; then
            echo
            echo "ERROR: Duplicate or missing KernelPackage/oaf."
            exit 1
          fi

          echo
          echo "Searching Package/appfilter definitions..."
          echo

          APP_FILES="$(
            grep -Rsl \
              --include='Makefile' \
              'define Package/appfilter' \
              package feeds \
              2>/dev/null \
              || true
          )"

          printf '%s\n' "${APP_FILES}"

          APP_COUNT="$(
            printf '%s\n' "${APP_FILES}" \
              | sed '/^$/d' \
              | wc -l
          )"

          echo
          echo "Package/appfilter definitions: ${APP_COUNT}"

          if [ "${APP_COUNT}" -ne 1 ]; then
            echo
            echo "ERROR: Duplicate or missing Package/appfilter."
            exit 1
          fi

      # ============================================================
      # Fixed release tag:
      #
      # Load official x86/64 config.buildinfo.
      #
      # This is important for matching the official ImmortalWrt
      # kernel configuration / ABI as closely as possible.
      # ============================================================

      - name: Load official x86_64 config
        if: steps.validate_iwrt.outputs.type == 'tag'
        shell: bash
        working-directory: immortalwrt
        env:
          RELEASE: ${{ steps.validate_iwrt.outputs.release }}
        run: |
          set -euxo pipefail

          CONFIG_URL="https://downloads.immortalwrt.org/releases/${RELEASE}/targets/x86/64/config.buildinfo"

          echo "Downloading official config:"
          echo "${CONFIG_URL}"

          if ! curl \
            -fL \
            --retry 5 \
            --retry-delay 3 \
            -o .config \
            "${CONFIG_URL}"; then

            echo
            echo "============================================================"
            echo "ERROR: Official x86/64 config.buildinfo is unavailable."
            echo
            echo "ImmortalWrt tag: v${RELEASE}"
            echo
            echo "The Git tag may exist before official firmware files"
            echo "have been published."
            echo "============================================================"
            exit 1
          fi

          test -s .config

      # ============================================================
      # Rolling branch:
      #
      # openwrt-25.12 has no immutable official release config.
      # Build current branch HEAD as generic x86_64.
      # ============================================================

      - name: Configure x86_64 branch
        if: steps.validate_iwrt.outputs.type == 'branch'
        shell: bash
        working-directory: immortalwrt
        run: |
          set -euxo pipefail

          cat > .config <<'EOF'
          CONFIG_TARGET_x86=y
          CONFIG_TARGET_x86_64=y
          CONFIG_TARGET_x86_64_DEVICE_generic=y
          EOF

      # ============================================================
      # Enable all three OAF packages
      #
      # kmod-oaf
      # appfilter
      # luci-app-oaf
      # ============================================================

      - name: Configure OpenAppFilter
        shell: bash
        working-directory: immortalwrt
        run: |
          set -euxo pipefail

          #
          # Remove old OAF selections from official config.
          #
          sed -i -E \
            '/^(# )?CONFIG_PACKAGE_(kmod-oaf|appfilter|luci-app-appfilter|luci-app-oaf)(=| is not set)/d' \
            .config || true

          #
          # Enable all three current upstream OAF packages.
          #
          cat >> .config <<'EOF'

          CONFIG_PACKAGE_kmod-oaf=m
          CONFIG_PACKAGE_appfilter=m
          CONFIG_PACKAGE_luci-app-oaf=m
          CONFIG_LUCI_LANG_zh_Hans=y
          EOF

          #
          # Force Kconfig/package metadata regeneration.
          #
          rm -rf tmp

          make defconfig 2>&1 | tee /tmp/oaf-defconfig.log

          #
          # make defconfig may print recursive dependency errors
          # without returning a non-zero status, so explicitly check.
          #
          if grep -q "recursive dependency detected" /tmp/oaf-defconfig.log; then
            echo
            echo "============================================================"
            echo "ERROR: recursive Kconfig dependency detected."
            echo "============================================================"
            exit 1
          fi

          echo
          echo "================ OAF CONFIG ================="
          grep -E \
            '^CONFIG_PACKAGE_(kmod-oaf|appfilter|luci-app-oaf)=' \
            .config \
            || true
          echo "============================================="
          echo

          grep -Eq '^CONFIG_PACKAGE_kmod-oaf=[my]$' .config
          grep -Eq '^CONFIG_PACKAGE_appfilter=[my]$' .config
          grep -Eq '^CONFIG_PACKAGE_luci-app-oaf=[my]$' .config

      # ============================================================
      # Show final build information
      # ============================================================

      - name: Show build configuration
        shell: bash
        working-directory: immortalwrt
        run: |
          set -euo pipefail

          echo
          echo "============================================================"
          echo "Build configuration"
          echo "============================================================"

          grep -E \
            '^(CONFIG_TARGET_x86|CONFIG_TARGET_x86_64|CONFIG_TARGET_x86_64_DEVICE_generic)=' \
            .config \
            || true

          echo

          grep -E \
            '^CONFIG_PACKAGE_(kmod-oaf|appfilter|luci-app-oaf)=' \
            .config

          echo "============================================================"

      # ============================================================
      # Build host tools
      # ============================================================

      - name: Build tools
        shell: bash
        working-directory: immortalwrt
        run: |
          set -o pipefail

          make \
            tools/install \
            -j"$(nproc)" \
            V=s \
            2>&1 | tee "${GITHUB_WORKSPACE}/tools.log"

      # ============================================================
      # Build toolchain
      # ============================================================

      - name: Build toolchain
        shell: bash
        working-directory: immortalwrt
        run: |
          set -o pipefail

          make \
            toolchain/install \
            -j"$(nproc)" \
            V=s \
            2>&1 | tee "${GITHUB_WORKSPACE}/toolchain.log"

      # ============================================================
      # Prepare/build kernel
      #
      # Required because kmod-oaf produces oaf.ko.
      # ============================================================

      - name: Build kernel environment
        shell: bash
        working-directory: immortalwrt
        run: |
          set -o pipefail

          make \
            target/linux/compile \
            -j"$(nproc)" \
            V=s \
            2>&1 | tee "${GITHUB_WORKSPACE}/kernel.log"

      # ============================================================
      # Read kernel version and vermagic from actual build
      # ============================================================

      - name: Detect kernel information
        id: kernel
        shell: bash
        working-directory: immortalwrt
        run: |
          set -euxo pipefail

          VERMAGIC_FILE="$(
            find build_dir \
              -type f \
              -name '.vermagic' \
              -print \
              -quit
          )"

          if [ -z "${VERMAGIC_FILE}" ]; then
            echo "ERROR: Kernel .vermagic file not found."
            exit 1
          fi

          KERNEL_VERMAGIC="$(
            cat "${VERMAGIC_FILE}"
          )"

          KERNEL_DIR="$(
            dirname "${VERMAGIC_FILE}"
          )"

          KERNEL_VERSION="$(
            basename "${KERNEL_DIR}" \
            | sed -nE 's/^linux-([0-9]+\.[0-9]+\.[0-9]+.*)$/\1/p'
          )"

          if [ -z "${KERNEL_VERSION}" ]; then

            KERNEL_VERSION="$(
              find build_dir \
                -type d \
                -name 'linux-[0-9]*' \
                | sed -nE \
                  's#^.*/linux-([0-9]+\.[0-9]+\.[0-9]+.*)$#\1#p' \
                | head -n 1
            )"

          fi

          echo
          echo "============================================================"
          echo "Kernel version : ${KERNEL_VERSION}"
          echo "Kernel vermagic: ${KERNEL_VERMAGIC}"
          echo "============================================================"

          echo "version=${KERNEL_VERSION}" >> "${GITHUB_OUTPUT}"
          echo "vermagic=${KERNEL_VERMAGIC}" >> "${GITHUB_OUTPUT}"

      # ============================================================
      # Build all three OpenAppFilter packages together
      #
      #   kmod-oaf
      #   appfilter
      #   luci-app-oaf
      # ============================================================

      - name: Build OpenAppFilter packages
        shell: bash
        working-directory: immortalwrt
        run: |
          set -o pipefail

          make \
            package/OpenAppFilter/oaf/compile \
            package/OpenAppFilter/open-app-filter/compile \
            package/OpenAppFilter/luci-app-oaf/compile \
            -j"$(nproc)" \
            V=s \
            2>&1 | tee "${GITHUB_WORKSPACE}/openappfilter.log"

      # ============================================================
      # Collect all generated OAF APK packages
      # ============================================================

      - name: Collect OpenAppFilter packages
        id: collect
        shell: bash
        working-directory: immortalwrt
        env:
          IWRT_REF: ${{ steps.iwrt.outputs.ref }}
          IWRT_COMMIT: ${{ steps.iwrt.outputs.short_commit }}
          OAF_TAG: ${{ steps.oaf.outputs.tag }}
          OAF_COMMIT: ${{ steps.oaf_source.outputs.short_commit }}
          OAF_VERSION: ${{ steps.oaf_source.outputs.version }}
          KERNEL_VERSION: ${{ steps.kernel.outputs.version }}
          KERNEL_VERMAGIC: ${{ steps.kernel.outputs.vermagic }}
        run: |
          set -euxo pipefail

          OUT="${GITHUB_WORKSPACE}/out"
          PKG="${OUT}/packages"

          rm -rf "${OUT}"
          mkdir -p "${PKG}"

          #
          # 1. kmod-oaf
          #
          find bin \
            -type f \
            -name 'kmod-oaf*.apk' \
            -exec cp -v {} "${PKG}/" \;

          #
          # 2. appfilter
          #
          find bin \
            -type f \
            -name 'appfilter*.apk' \
            -exec cp -v {} "${PKG}/" \;

          #
          # 3. luci-app-oaf
          #
          find bin \
            -type f \
            -name 'luci-app-oaf*.apk' \
            -exec cp -v {} "${PKG}/" \;

          #
          # Optional Chinese translation package
          #
          find bin \
            -type f \
            -name 'luci-i18n-oaf-*.apk' \
            -exec cp -v {} "${PKG}/" \;

          echo
          echo "============================================================"
          echo "Generated OpenAppFilter packages"
          echo "============================================================"
          ls -lh "${PKG}"
          echo "============================================================"

          #
          # Verify all three core packages exist.
          #
          KMOD_PACKAGE="$(
            find "${PKG}" \
              -maxdepth 1 \
              -type f \
              -name 'kmod-oaf*.apk' \
              -print \
              -quit
          )"

          APPFILTER_PACKAGE="$(
            find "${PKG}" \
              -maxdepth 1 \
              -type f \
              -name 'appfilter*.apk' \
              -print \
              -quit
          )"

          LUCI_PACKAGE="$(
            find "${PKG}" \
              -maxdepth 1 \
              -type f \
              -name 'luci-app-oaf*.apk' \
              -print \
              -quit
          )"

          if [ -z "${KMOD_PACKAGE}" ]; then
            echo "ERROR: kmod-oaf APK was not generated."
            exit 1
          fi

          if [ -z "${APPFILTER_PACKAGE}" ]; then
            echo "ERROR: appfilter APK was not generated."
            exit 1
          fi

          if [ -z "${LUCI_PACKAGE}" ]; then
            echo "ERROR: luci-app-oaf APK was not generated."
            exit 1
          fi

          #
          # SHA256
          #
          (
            cd "${PKG}"
            sha256sum *.apk > SHA256SUMS
          )

          SAFE_IWRT_REF="$(
            printf '%s' "${IWRT_REF}" \
              | tr '/' '-'
          )"

          #
          # Build information
          #
          cat > "${PKG}/BUILD_INFO.txt" <<EOF
          OpenAppFilter for ImmortalWrt
          ============================================================

          OpenAppFilter tag:
          ${OAF_TAG}

          OpenAppFilter version:
          ${OAF_VERSION}

          OpenAppFilter commit:
          ${OAF_COMMIT}

          ------------------------------------------------------------

          ImmortalWrt ref:
          ${IWRT_REF}

          ImmortalWrt commit:
          ${IWRT_COMMIT}

          Target:
          x86/64

          ------------------------------------------------------------

          Kernel version:
          ${KERNEL_VERSION}

          Kernel vermagic:
          ${KERNEL_VERMAGIC}

          ------------------------------------------------------------

          Packages:

          $(basename "${KMOD_PACKAGE}")
          $(basename "${APPFILTER_PACKAGE}")
          $(basename "${LUCI_PACKAGE}")

          ------------------------------------------------------------

          Source:

          https://github.com/destan19/OpenAppFilter
          https://github.com/immortalwrt/immortalwrt
          EOF

          #
          # Archive name
          #
          ARCHIVE_NAME="immortalwrt-${SAFE_IWRT_REF}-oaf-${OAF_TAG}-x86_64-kernel_${KERNEL_VERSION}"

          tar \
            -C "${PKG}" \
            -czf "${OUT}/${ARCHIVE_NAME}.tar.gz" \
            .

          echo "archive_name=${ARCHIVE_NAME}" >> "${GITHUB_OUTPUT}"
          echo "safe_iwrt_ref=${SAFE_IWRT_REF}" >> "${GITHUB_OUTPUT}"

      # ============================================================
      # Upload GitHub Actions Artifact
      #
      # Contains:
      #
      # kmod-oaf
      # appfilter
      # luci-app-oaf
      # luci-i18n-oaf-* (if generated)
      # SHA256SUMS
      # BUILD_INFO.txt
      # tar.gz
      # ============================================================

      - name: Upload Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.collect.outputs.archive_name }}
          path: |
            out/packages/*.apk
            out/packages/SHA256SUMS
            out/packages/BUILD_INFO.txt
            out/*.tar.gz
          if-no-files-found: error
          retention-days: 30

      # ============================================================
      # Prepare GitHub Release information
      #
      # For openwrt-25.12 branch:
      # include commit because branch keeps changing.
      #
      # For fixed v25.12.x tag:
      # commit is also retained to make the build reproducible.
      # ============================================================

      - name: Prepare GitHub Release
        id: release
        shell: bash
        env:
          IWRT_REF: ${{ steps.iwrt.outputs.ref }}
          IWRT_COMMIT: ${{ steps.iwrt.outputs.short_commit }}
          OAF_TAG: ${{ steps.oaf.outputs.tag }}
        run: |
          set -euxo pipefail

          SAFE_IWRT_REF="$(
            printf '%s' "${IWRT_REF}" \
              | tr '/' '-'
          )"

          TAG="oaf-${OAF_TAG}-immortalwrt-${SAFE_IWRT_REF}-${IWRT_COMMIT}-x86_64"

          echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"

      # ============================================================
      # Create or update GitHub Release
      #
      # Re-running the exact same source/tag updates existing assets
      # with --clobber instead of needing force_rebuild.
      # ============================================================

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}

          RELEASE_TAG: ${{ steps.release.outputs.tag }}

          IWRT_REF: ${{ steps.iwrt.outputs.ref }}
          IWRT_COMMIT: ${{ steps.iwrt.outputs.commit }}

          OAF_TAG: ${{ steps.oaf.outputs.tag }}
          OAF_COMMIT: ${{ steps.oaf_source.outputs.commit }}
          OAF_VERSION: ${{ steps.oaf_source.outputs.version }}

          KERNEL_VERSION: ${{ steps.kernel.outputs.version }}
          KERNEL_VERMAGIC: ${{ steps.kernel.outputs.vermagic }}
        run: |
          set -euxo pipefail

          cat > "${GITHUB_WORKSPACE}/release-notes.md" <<EOF
          ## OpenAppFilter

          - OAF tag: \`${OAF_TAG}\`
          - OAF version: \`${OAF_VERSION}\`
          - OAF commit: \`${OAF_COMMIT}\`

          ## ImmortalWrt

          - Source ref: \`${IWRT_REF}\`
          - Commit: \`${IWRT_COMMIT}\`
          - Target: \`x86/64\`

          ## Kernel

          - Version: \`${KERNEL_VERSION}\`
          - Vermagic: \`${KERNEL_VERMAGIC}\`

          ## Packages

          本 Release 同时包含：

          - \`kmod-oaf\`
          - \`appfilter\`
          - \`luci-app-oaf\`
          - \`luci-i18n-oaf-zh-cn\`（如果上游生成）

          \`kmod-oaf\` 与当前构建使用的 ImmortalWrt Kernel ABI 绑定，
          请勿安装到 Kernel ABI 不一致的系统。

          ---

          OpenAppFilter source:
          https://github.com/destan19/OpenAppFilter

          ImmortalWrt source:
          https://github.com/immortalwrt/immortalwrt
          EOF

          RELEASE_NAME="OAF ${OAF_TAG} - ImmortalWrt ${IWRT_REF} - x86_64"

          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then

            echo "Release already exists. Updating..."

            gh release edit \
              "${RELEASE_TAG}" \
              --title "${RELEASE_NAME}" \
              --notes-file "${GITHUB_WORKSPACE}/release-notes.md"

          else

            echo "Creating new release..."

            gh release create \
              "${RELEASE_TAG}" \
              --title "${RELEASE_NAME}" \
              --notes-file "${GITHUB_WORKSPACE}/release-notes.md"

          fi

          gh release upload \
            "${RELEASE_TAG}" \
            out/packages/*.apk \
            out/packages/SHA256SUMS \
            out/packages/BUILD_INFO.txt \
            out/*.tar.gz \
            --clobber

          echo
          echo "============================================================"
          echo "Release published:"
          echo "${RELEASE_TAG}"
          echo "============================================================"
