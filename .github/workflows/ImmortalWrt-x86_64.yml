name: Build OpenAppFilter for ImmortalWrt x86_64

on:
  workflow_dispatch:
    inputs:
      immortalwrt_version:
        description: '选择 ImmortalWrt 源码版本'
        required: true
        default: 'v25.12.2'
        type: choice
        options:
          - openwrt-25.12
          - v25.12.0
          - v25.12.1
          - v25.12.2
          - v25.12.3
          - v25.12.4
          - v25.12.5
          - v25.12.6

permissions:
  contents: write

env:
  IMMORTALWRT_REPO: https://github.com/immortalwrt/immortalwrt.git
  OAF_REPO: https://github.com/destan19/OpenAppFilter.git

jobs:
  build:
    name: OAF ${{ inputs.immortalwrt_version }} x86_64
    runs-on: ubuntu-24.04

    steps:
      # ============================================================
      # Checkout builder repository
      # ============================================================

      - name: Checkout
        uses: actions/checkout@v6

      # ============================================================
      # Free disk space
      # ============================================================

      - name: Free disk space
        shell: bash
        run: |
          set -euxo pipefail

          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /opt/hostedtoolcache/CodeQL || true

          df -h

      # ============================================================
      # Build dependencies
      # ============================================================

      - name: Install build dependencies
        shell: bash
        run: |
          set -euxo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            clang \
            flex \
            bison \
            g++ \
            gawk \
            gcc-multilib \
            g++-multilib \
            gettext \
            git \
            libelf-dev \
            libncurses-dev \
            libssl-dev \
            zlib1g-dev \
            python3 \
            python3-setuptools \
            python3-pyelftools \
            rsync \
            swig \
            unzip \
            file \
            wget \
            curl \
            zstd \
            ccache \
            dwarves \
            genisoimage

          echo
          echo "========== Build tools =========="
          gcc --version | head -n 1
          python3 --version
          git --version
          command -v mkisofs
          mkisofs --version || true
          echo "================================="

      # ============================================================
      # Validate selected ImmortalWrt ref
      #
      # openwrt-25.12 = branch
      # v25.12.x     = tag
      # ============================================================

      - name: Validate ImmortalWrt ref
        id: iwrt_ref
        shell: bash
        env:
          IWRT_REF: ${{ inputs.immortalwrt_version }}
        run: |
          set -euxo pipefail

          if [[ "${IWRT_REF}" == v* ]]; then

            echo "Checking tag: ${IWRT_REF}"

            git ls-remote \
              --exit-code \
              --tags \
              "${IMMORTALWRT_REPO}" \
              "refs/tags/${IWRT_REF}" \
              >/dev/null

            RELEASE="${IWRT_REF#v}"

            echo "type=tag" >> "${GITHUB_OUTPUT}"
            echo "release=${RELEASE}" >> "${GITHUB_OUTPUT}"

          else

            echo "Checking branch: ${IWRT_REF}"

            git ls-remote \
              --exit-code \
              --heads \
              "${IMMORTALWRT_REPO}" \
              "refs/heads/${IWRT_REF}" \
              >/dev/null

            echo "type=branch" >> "${GITHUB_OUTPUT}"
            echo "release=${IWRT_REF}" >> "${GITHUB_OUTPUT}"

          fi

          echo
          echo "ImmortalWrt ref is valid."

      # ============================================================
      # Clone ImmortalWrt
      # ============================================================

      - name: Clone ImmortalWrt
        id: iwrt
        shell: bash
        env:
          IWRT_REF: ${{ inputs.immortalwrt_version }}
        run: |
          set -euxo pipefail

          git clone \
            --depth 1 \
            --single-branch \
            --filter=blob:none \
            --branch "${IWRT_REF}" \
            "${IMMORTALWRT_REPO}" \
            immortalwrt

          cd immortalwrt

          IWRT_COMMIT="$(git rev-parse HEAD)"
          IWRT_SHORT="$(git rev-parse --short=8 HEAD)"

          echo
          echo "============================================================"
          echo "ImmortalWrt"
          echo "============================================================"
          echo "Ref:    ${IWRT_REF}"
          echo "Commit: ${IWRT_COMMIT}"
          echo "============================================================"

          echo "ref=${IWRT_REF}" >> "${GITHUB_OUTPUT}"
          echo "commit=${IWRT_COMMIT}" >> "${GITHUB_OUTPUT}"
          echo "short_commit=${IWRT_SHORT}" >> "${GITHUB_OUTPUT}"

      # ============================================================
      # Fixed release tag:
      #
      # Use the exact config.buildinfo and feeds.buildinfo used by
      # the official ImmortalWrt x86/64 release.
      #
      # feeds.buildinfo contains exact feed commit hashes.
      # ============================================================

      - name: Load official release build information
        if: steps.iwrt_ref.outputs.type == 'tag'
        shell: bash
        working-directory: immortalwrt
        env:
          RELEASE: ${{ steps.iwrt_ref.outputs.release }}
        run: |
          set -euxo pipefail

          BASE_URL="https://downloads.immortalwrt.org/releases/${RELEASE}/targets/x86/64"

          echo
          echo "============================================================"
          echo "Loading official ImmortalWrt ${RELEASE} x86/64 build info"
          echo "============================================================"

          curl \
            -fsSL \
            --retry 5 \
            --retry-delay 3 \
            -o .config \
            "${BASE_URL}/config.buildinfo"

          curl \
            -fsSL \
            --retry 5 \
            --retry-delay 3 \
            -o feeds.conf.default \
            "${BASE_URL}/feeds.buildinfo"

          test -s .config
          test -s feeds.conf.default

          echo
          echo "========== Official feeds =========="
          cat feeds.conf.default
          echo "===================================="

          echo
          echo "========== Official target ========="
          grep -E \
            '^CONFIG_TARGET_(x86|x86_64|DEVICE_x86_64_DEVICE_generic)=' \
            .config \
            || true
          echo "===================================="

      # ============================================================
      # Rolling branch:
      #
      # No immutable release config exists.
      # Build current branch HEAD for generic x86/64.
      # ============================================================

      - name: Configure rolling x86_64 branch
        if: steps.iwrt_ref.outputs.type == 'branch'
        shell: bash
        working-directory: immortalwrt
        run: |
          set -euxo pipefail

          cat > .config <<'EOF'
          CONFIG_TARGET_x86=y
          CONFIG_TARGET_x86_64=y
          CONFIG_TARGET_x86_64_DEVICE_generic=y
          CONFIG_TARGET_DEVICE_x86_64_DEVICE_generic=y
          EOF

      # ============================================================
      # Update/install feeds
      #
      # For fixed tags feeds.conf.default is already replaced with
      # the official feeds.buildinfo, therefore exact feed revisions
      # from the official release are used.
      # ============================================================

      - name: Update and install feeds
        shell: bash
        working-directory: immortalwrt
        run: |
          set -euxo pipefail

          ./scripts/feeds update -a
          ./scripts/feeds install -a

      # ============================================================
      # Remove ImmortalWrt's installed built-in OAF package links.
      #
      # IMPORTANT:
      # We only remove entries under package/feeds.
      #
      # We do NOT touch feeds/base because OpenWrt may map:
      #
      #   feeds/base -> ../package
      #
      # and that would cause us to remove our own package later.
      # ============================================================

      - name: Remove built-in ImmortalWrt OpenAppFilter
        shell: bash
        working-directory: immortalwrt
        run: |
          set -euo pipefail

          echo
          echo "============================================================"
          echo "Searching installed feed packages conflicting with OAF"
          echo "============================================================"

          REMOVED=0

          for feed_dir in package/feeds/*; do

            [ -d "${feed_dir}" ] || continue

            for package_dir in "${feed_dir}"/*; do

              if [ ! -e "${package_dir}" ] && [ ! -L "${package_dir}" ]; then
                continue
              fi

              PACKAGE_NAME="$(basename "${package_dir}")"
              MAKEFILE="${package_dir}/Makefile"
              REMOVE=0

              case "${PACKAGE_NAME}" in
                OpenAppFilter|open-app-filter|luci-app-appfilter)
                  REMOVE=1
                  ;;
              esac

              if [ "${REMOVE}" -eq 0 ] && [ -f "${MAKEFILE}" ]; then

                if grep -Eq \
                  '^[[:space:]]*define[[:space:]]+(KernelPackage/oaf|Package/appfilter)[[:space:]]*$' \
                  "${MAKEFILE}"; then

                  REMOVE=1
                fi
              fi

              if [ "${REMOVE}" -eq 1 ]; then
                echo "Removing: ${package_dir}"
                rm -rf "${package_dir}"
                REMOVED=$((REMOVED + 1))
              fi

            done

          done

          rm -rf tmp

          echo
          echo "Removed ${REMOVED} built-in OAF package link(s)."

      # ============================================================
      # Resolve latest stable OpenAppFilter tag
      #
      # Only normal semantic version tags are accepted:
      #
      # v6.1.8
      # v7.0.1
      # v7.0.2
      #
      # beta / rc / master are ignored.
      # ============================================================

      - name: Resolve latest OpenAppFilter tag
        id: oaf
        shell: bash
        run: |
          set -euxo pipefail

          OAF_TAG="$(
            git ls-remote \
              --tags \
              --refs \
              "${OAF_REPO}" \
              'refs/tags/v*' \
            | sed 's#.*refs/tags/##' \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
            | sort -V \
            | tail -n 1
          )"

          if [ -z "${OAF_TAG}" ]; then
            echo "ERROR: No stable OpenAppFilter tag found."
            exit 1
          fi

          git ls-remote \
            --exit-code \
            --tags \
            "${OAF_REPO}" \
            "refs/tags/${OAF_TAG}" \
            >/dev/null

          echo
          echo "============================================================"
          echo "OpenAppFilter latest stable tag: ${OAF_TAG}"
          echo "============================================================"

          echo "tag=${OAF_TAG}" >> "${GITHUB_OUTPUT}"

      # ============================================================
      # Clone OAF exactly as upstream documentation recommends
      # ============================================================

      - name: Clone OpenAppFilter
        id: oaf_source
        shell: bash
        working-directory: immortalwrt
        env:
          OAF_TAG: ${{ steps.oaf.outputs.tag }}
        run: |
          set -euxo pipefail

          rm -rf package/OpenAppFilter

          git clone \
            --depth 1 \
            --single-branch \
            --branch "${OAF_TAG}" \
            "${OAF_REPO}" \
            package/OpenAppFilter

          OAF_COMMIT="$(
            git -C package/OpenAppFilter rev-parse HEAD
          )"

          OAF_SHORT="$(
            git -C package/OpenAppFilter rev-parse --short=8 HEAD
          )"

          echo
          echo "============================================================"
          echo "OpenAppFilter"
          echo "============================================================"
          echo "Tag:    ${OAF_TAG}"
          echo "Commit: ${OAF_COMMIT}"
          echo "============================================================"

          echo "commit=${OAF_COMMIT}" >> "${GITHUB_OUTPUT}"
          echo "short_commit=${OAF_SHORT}" >> "${GITHUB_OUTPUT}"

      # ============================================================
      # Verify there is exactly one real OAF definition.
      #
      # Only scan package/, never feeds/base.
      #
      # Resolve symlinks before counting so aliases cannot be counted
      # twice.
      # ============================================================

      - name: Verify OpenAppFilter package definitions
        shell: bash
        working-directory: immortalwrt
        run: |
          set -euo pipefail

          mapfile -t KMOD_FILES < <(
            grep -Rsl \
              --include='Makefile' \
              'define KernelPackage/oaf' \
              package \
              2>/dev/null \
            | while IFS= read -r file; do
                readlink -f "${file}"
              done \
            | sort -u
          )

          mapfile -t APP_FILES < <(
            grep -Rsl \
              --include='Makefile' \
              'define Package/appfilter' \
              package \
              2>/dev/null \
            | while IFS= read -r file; do
                readlink -f "${file}"
              done \
            | sort -u
          )

          echo
          echo "========== KernelPackage/oaf =========="
          printf '%s\n' "${KMOD_FILES[@]}"
          echo "Count: ${#KMOD_FILES[@]}"

          echo
          echo "========== Package/appfilter =========="
          printf '%s\n' "${APP_FILES[@]}"
          echo "Count: ${#APP_FILES[@]}"

          if [ "${#KMOD_FILES[@]}" -ne 1 ]; then
            echo
            echo "ERROR: KernelPackage/oaf definition count must be 1."
            exit 1
          fi

          if [ "${#APP_FILES[@]}" -ne 1 ]; then
            echo
            echo "ERROR: Package/appfilter definition count must be 1."
            exit 1
          fi

          case "${KMOD_FILES[0]}" in
            */package/OpenAppFilter/oaf/Makefile)
              ;;
            *)
              echo
              echo "ERROR: kmod-oaf is not coming from destan19/OpenAppFilter."
              exit 1
              ;;
          esac

          case "${APP_FILES[0]}" in
            */package/OpenAppFilter/open-app-filter/Makefile)
              ;;
            *)
              echo
              echo "ERROR: appfilter is not coming from destan19/OpenAppFilter."
              exit 1
              ;;
          esac

          echo
          echo "OpenAppFilter package definitions are clean."

      # ============================================================
      # Configure OAF exactly as upstream documentation:
      #
      # echo "CONFIG_PACKAGE_luci-app-oaf=y" >> .config
      # make defconfig
      #
      # This automatically enables:
      #
      # appfilter
      # kmod-oaf
      # ============================================================

      - name: Configure OpenAppFilter
        shell: bash
        working-directory: immortalwrt
        run: |
          set -euxo pipefail

          sed -i -E \
            '/^(# )?CONFIG_PACKAGE_(kmod-oaf|appfilter|luci-app-oaf|luci-app-appfilter)(=| is not set)/d' \
            .config \
            || true

          cat >> .config <<'EOF'

          CONFIG_PACKAGE_luci-app-oaf=y
          CONFIG_LUCI_LANG_zh_Hans=y
          EOF

          rm -rf tmp

          make defconfig 2>&1 | tee /tmp/oaf-defconfig.log

          if grep -q "recursive dependency detected" /tmp/oaf-defconfig.log; then
            echo
            echo "ERROR: recursive Kconfig dependency detected."
            exit 1
          fi

          echo
          echo "============================================================"
          echo "OAF configuration"
          echo "============================================================"

          grep -E \
            '^CONFIG_PACKAGE_(kmod-oaf|appfilter|luci-app-oaf)=' \
            .config \
            || true

          echo "============================================================"

          grep -q '^CONFIG_PACKAGE_luci-app-oaf=y$' .config
          grep -q '^CONFIG_PACKAGE_appfilter=y$' .config
          grep -q '^CONFIG_PACKAGE_kmod-oaf=y$' .config

      # ============================================================
      # Download all selected sources
      # ============================================================

      - name: Download sources
        shell: bash
        working-directory: immortalwrt
        run: |
          set -euxo pipefail

          make download \
            -j"$(nproc)"

      # ============================================================
      # Prepare host build tools
      # ============================================================

      - name: Build host tools
        shell: bash
        working-directory: immortalwrt
        run: |
          set -o pipefail

          make tools/install \
            -j"$(nproc)" \
            V=s \
            2>&1 | tee "${GITHUB_WORKSPACE}/tools.log"

      # ============================================================
      # Build cross toolchain
      # ============================================================

      - name: Build toolchain
        shell: bash
        working-directory: immortalwrt
        run: |
          set -o pipefail

          make toolchain/install \
            -j"$(nproc)" \
            V=s \
            2>&1 | tee "${GITHUB_WORKSPACE}/toolchain.log"

      # ============================================================
      # Build kernel environment
      #
      # Required for external kernel module oaf.ko.
      # ============================================================

      - name: Build kernel environment
        shell: bash
        working-directory: immortalwrt
        run: |
          set -o pipefail

          make target/linux/compile \
            -j"$(nproc)" \
            V=s \
            2>&1 | tee "${GITHUB_WORKSPACE}/kernel.log"

      # ============================================================
      # Detect actual kernel version / release / vermagic.
      #
      # For fixed ImmortalWrt tags, compare against the official
      # x86/64 kmods ABI and STOP if it does not match.
      # ============================================================

      - name: Verify kernel ABI
        id: kernel
        shell: bash
        working-directory: immortalwrt
        env:
          REF_TYPE: ${{ steps.iwrt_ref.outputs.type }}
          RELEASE: ${{ steps.iwrt_ref.outputs.release }}
        run: |
          set -euxo pipefail

          VERMAGIC_FILE="$(
            find build_dir \
              -type f \
              -path '*/linux-x86_64/linux-*/.vermagic' \
              -print \
              -quit
          )"

          if [ -z "${VERMAGIC_FILE}" ]; then
            echo "ERROR: kernel .vermagic file not found."
            exit 1
          fi

          KERNEL_VERMAGIC="$(
            tr -d '\r\n' < "${VERMAGIC_FILE}"
          )"

          KERNEL_DIR="$(
            dirname "${VERMAGIC_FILE}"
          )"

          KERNEL_VERSION="$(
            basename "${KERNEL_DIR}"
          )"

          KERNEL_VERSION="${KERNEL_VERSION#linux-}"

          DUMPINFO="$(
            make -s target/linux/dumpinfo 2>/dev/null \
            || true
          )"

          KERNEL_RELEASE="$(
            printf '%s\n' "${DUMPINFO}" \
              | sed -n \
                's/^Linux-Release:[[:space:]]*//p' \
              | head -n 1
          )"

          OFFICIAL_ABI=""

          if [ "${REF_TYPE}" = "tag" ]; then

            KMOD_URL="https://downloads.immortalwrt.org/releases/${RELEASE}/targets/x86/64/kmods/"

            OFFICIAL_ABI="$(
              curl -fsSL "${KMOD_URL}" \
                | grep -oE \
                  'href="[0-9]+\.[0-9]+\.[0-9]+-[0-9]+-[0-9a-f]{32}/"' \
                | sed -E \
                  's/^href="([^"]+)\/"$/\1/' \
                | sort -Vu \
                | head -n 1
            )"

            if [ -z "${OFFICIAL_ABI}" ]; then
              echo "ERROR: Unable to detect official kernel ABI."
              exit 1
            fi

            OFFICIAL_VERSION="$(
              printf '%s' "${OFFICIAL_ABI}" \
                | cut -d- -f1
            )"

            OFFICIAL_RELEASE="$(
              printf '%s' "${OFFICIAL_ABI}" \
                | cut -d- -f2
            )"

            OFFICIAL_VERMAGIC="$(
              printf '%s' "${OFFICIAL_ABI}" \
                | cut -d- -f3
            )"

            if [ -z "${KERNEL_RELEASE}" ]; then
              KERNEL_RELEASE="${OFFICIAL_RELEASE}"
            fi

            BUILT_ABI="${KERNEL_VERSION}-${KERNEL_RELEASE}-${KERNEL_VERMAGIC}"

            echo
            echo "============================================================"
            echo "Kernel ABI verification"
            echo "============================================================"
            echo "Built:    ${BUILT_ABI}"
            echo "Official: ${OFFICIAL_ABI}"
            echo "============================================================"

            if [ "${KERNEL_VERSION}" != "${OFFICIAL_VERSION}" ]; then
              echo "ERROR: Kernel version mismatch."
              exit 1
            fi

            if [ "${KERNEL_RELEASE}" != "${OFFICIAL_RELEASE}" ]; then
              echo "ERROR: Kernel release mismatch."
              exit 1
            fi

            if [ "${KERNEL_VERMAGIC}" != "${OFFICIAL_VERMAGIC}" ]; then
              echo "ERROR: Kernel vermagic mismatch."
              exit 1
            fi

            if [ "${BUILT_ABI}" != "${OFFICIAL_ABI}" ]; then
              echo "ERROR: Kernel ABI mismatch."
              exit 1
            fi

            echo
            echo "Kernel ABI matches official ImmortalWrt firmware."

          else

            if [ -z "${KERNEL_RELEASE}" ]; then
              KERNEL_RELEASE="unknown"
            fi

            BUILT_ABI="${KERNEL_VERSION}-${KERNEL_RELEASE}-${KERNEL_VERMAGIC}"

            echo
            echo "============================================================"
            echo "Rolling branch kernel"
            echo "============================================================"
            echo "Kernel ABI: ${BUILT_ABI}"
            echo
            echo "No official release ABI comparison is performed for"
            echo "openwrt-25.12 because it is a moving branch."
            echo "============================================================"

          fi

          echo "version=${KERNEL_VERSION}" >> "${GITHUB_OUTPUT}"
          echo "release=${KERNEL_RELEASE}" >> "${GITHUB_OUTPUT}"
          echo "vermagic=${KERNEL_VERMAGIC}" >> "${GITHUB_OUTPUT}"
          echo "abi=${BUILT_ABI}" >> "${GITHUB_OUTPUT}"
          echo "official_abi=${OFFICIAL_ABI}" >> "${GITHUB_OUTPUT}"

      # ============================================================
      # Compile OAF using the exact upstream package targets.
      # ============================================================

      - name: Build luci-app-oaf
        shell: bash
        working-directory: immortalwrt
        run: |
          set -o pipefail

          make package/luci-app-oaf/compile \
            -j"$(nproc)" \
            V=s \
            2>&1 | tee "${GITHUB_WORKSPACE}/luci-app-oaf.log"

      - name: Build appfilter
        shell: bash
        working-directory: immortalwrt
        run: |
          set -o pipefail

          make package/open-app-filter/compile \
            -j"$(nproc)" \
            V=s \
            2>&1 | tee "${GITHUB_WORKSPACE}/open-app-filter.log"

      - name: Build kmod-oaf
        shell: bash
        working-directory: immortalwrt
        run: |
          set -o pipefail

          make package/oaf/compile \
            -j"$(nproc)" \
            V=s \
            2>&1 | tee "${GITHUB_WORKSPACE}/oaf.log"

      # ============================================================
      # Collect resulting APK packages
      # ============================================================

      - name: Collect OpenAppFilter packages
        id: collect
        shell: bash
        working-directory: immortalwrt
        env:
          IWRT_REF: ${{ steps.iwrt.outputs.ref }}
          IWRT_COMMIT: ${{ steps.iwrt.outputs.short_commit }}
          OAF_TAG: ${{ steps.oaf.outputs.tag }}
          OAF_COMMIT: ${{ steps.oaf_source.outputs.short_commit }}
          KERNEL_VERSION: ${{ steps.kernel.outputs.version }}
          KERNEL_ABI: ${{ steps.kernel.outputs.abi }}
          OFFICIAL_ABI: ${{ steps.kernel.outputs.official_abi }}
        run: |
          set -euxo pipefail

          OUT="${GITHUB_WORKSPACE}/out"
          PKG="${OUT}/packages"

          rm -rf "${OUT}"
          mkdir -p "${PKG}"

          find bin \
            -type f \
            \( \
              -name 'kmod-oaf*.apk' \
              -o -name 'appfilter*.apk' \
              -o -name 'luci-app-oaf*.apk' \
              -o -name 'luci-i18n-oaf-*.apk' \
            \) \
            -exec cp -v {} "${PKG}/" \;

          echo
          echo "============================================================"
          echo "Generated packages"
          echo "============================================================"

          ls -lh "${PKG}"

          echo "============================================================"

          if ! compgen -G "${PKG}/kmod-oaf*.apk" >/dev/null; then
            echo "ERROR: kmod-oaf APK not generated."
            exit 1
          fi

          if ! compgen -G "${PKG}/appfilter*.apk" >/dev/null; then
            echo "ERROR: appfilter APK not generated."
            exit 1
          fi

          if ! compgen -G "${PKG}/luci-app-oaf*.apk" >/dev/null; then
            echo "ERROR: luci-app-oaf APK not generated."
            exit 1
          fi

          (
            cd "${PKG}"
            sha256sum *.apk > SHA256SUMS
          )

          SAFE_IWRT_REF="$(
            printf '%s' "${IWRT_REF}" \
              | tr '/' '-'
          )"

          cat > "${PKG}/BUILD_INFO.txt" <<EOF
          OpenAppFilter for ImmortalWrt
          ============================================================

          OpenAppFilter tag:
          ${OAF_TAG}

          OpenAppFilter commit:
          ${OAF_COMMIT}

          ------------------------------------------------------------

          ImmortalWrt ref:
          ${IWRT_REF}

          ImmortalWrt commit:
          ${IWRT_COMMIT}

          Target:
          x86/64

          ------------------------------------------------------------

          Kernel version:
          ${KERNEL_VERSION}

          Built Kernel ABI:
          ${KERNEL_ABI}

          Official Kernel ABI:
          ${OFFICIAL_ABI:-N/A}

          ------------------------------------------------------------

          Core packages:

          kmod-oaf
          appfilter
          luci-app-oaf

          ------------------------------------------------------------

          OpenAppFilter:
          https://github.com/destan19/OpenAppFilter

          ImmortalWrt:
          https://github.com/immortalwrt/immortalwrt
          EOF

          ARCHIVE_NAME="immortalwrt-${SAFE_IWRT_REF}-oaf-${OAF_TAG}-x86_64-kernel_${KERNEL_VERSION}"

          tar \
            -C "${PKG}" \
            -czf "${OUT}/${ARCHIVE_NAME}.tar.gz" \
            .

          echo "archive_name=${ARCHIVE_NAME}" >> "${GITHUB_OUTPUT}"
          echo "safe_ref=${SAFE_IWRT_REF}" >> "${GITHUB_OUTPUT}"

      # ============================================================
      # Upload Actions artifact
      # ============================================================

      - name: Upload Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.collect.outputs.archive_name }}
          path: |
            out/packages/*.apk
            out/packages/SHA256SUMS
            out/packages/BUILD_INFO.txt
            out/*.tar.gz
          if-no-files-found: error
          retention-days: 30

      # ============================================================
      # Prepare release tag
      #
      # Fixed tag:
      #
      #   oaf-vX.X.X-immortalwrt-v25.12.2-x86_64
      #
      # Rolling branch:
      #
      #   oaf-vX.X.X-immortalwrt-openwrt-25.12-xxxxxxxx-x86_64
      # ============================================================

      - name: Prepare GitHub Release
        id: release
        shell: bash
        env:
          REF_TYPE: ${{ steps.iwrt_ref.outputs.type }}
          IWRT_REF: ${{ steps.iwrt.outputs.ref }}
          IWRT_COMMIT: ${{ steps.iwrt.outputs.short_commit }}
          OAF_TAG: ${{ steps.oaf.outputs.tag }}
        run: |
          set -euxo pipefail

          SAFE_IWRT_REF="$(
            printf '%s' "${IWRT_REF}" \
              | tr '/' '-'
          )"

          if [ "${REF_TYPE}" = "tag" ]; then

            RELEASE_TAG="oaf-${OAF_TAG}-immortalwrt-${SAFE_IWRT_REF}-x86_64"

          else

            RELEASE_TAG="oaf-${OAF_TAG}-immortalwrt-${SAFE_IWRT_REF}-${IWRT_COMMIT}-x86_64"

          fi

          echo "tag=${RELEASE_TAG}" >> "${GITHUB_OUTPUT}"

          echo
          echo "Release tag: ${RELEASE_TAG}"

      # ============================================================
      # Create/update GitHub Release
      # ============================================================

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}

          RELEASE_TAG: ${{ steps.release.outputs.tag }}

          IWRT_REF: ${{ steps.iwrt.outputs.ref }}
          IWRT_COMMIT: ${{ steps.iwrt.outputs.commit }}

          OAF_TAG: ${{ steps.oaf.outputs.tag }}
          OAF_COMMIT: ${{ steps.oaf_source.outputs.commit }}

          KERNEL_VERSION: ${{ steps.kernel.outputs.version }}
          KERNEL_ABI: ${{ steps.kernel.outputs.abi }}
          OFFICIAL_ABI: ${{ steps.kernel.outputs.official_abi }}
        run: |
          set -euxo pipefail

          RELEASE_NAME="OAF ${OAF_TAG} - ImmortalWrt ${IWRT_REF} - x86_64"

          cat > "${GITHUB_WORKSPACE}/release-notes.md" <<EOF
          ## OpenAppFilter

          - Tag: \`${OAF_TAG}\`
          - Commit: \`${OAF_COMMIT}\`

          ## ImmortalWrt

          - Ref: \`${IWRT_REF}\`
          - Commit: \`${IWRT_COMMIT}\`
          - Target: \`x86/64\`

          ## Kernel

          - Version: \`${KERNEL_VERSION}\`
          - Built ABI: \`${KERNEL_ABI}\`
          - Official ABI: \`${OFFICIAL_ABI:-N/A}\`

          ## Packages

          - \`kmod-oaf\`
          - \`appfilter\`
          - \`luci-app-oaf\`
          - \`luci-i18n-oaf-zh-cn\`（如果生成）

          固定 \`v25.12.x\` 版本在发布前会检查生成的 Kernel ABI
          是否与 ImmortalWrt 官方 x86/64 固件一致。

          \`openwrt-25.12\` 是滚动分支，因此只对应此次构建所记录的
          ImmortalWrt commit。

          ## Source

          OpenAppFilter:
          https://github.com/destan19/OpenAppFilter

          ImmortalWrt:
          https://github.com/immortalwrt/immortalwrt
          EOF

          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then

            echo "Updating existing release..."

            gh release edit \
              "${RELEASE_TAG}" \
              --title "${RELEASE_NAME}" \
              --notes-file "${GITHUB_WORKSPACE}/release-notes.md"

          else

            echo "Creating new release..."

            gh release create \
              "${RELEASE_TAG}" \
              --title "${RELEASE_NAME}" \
              --notes-file "${GITHUB_WORKSPACE}/release-notes.md"

          fi

          gh release upload \
            "${RELEASE_TAG}" \
            out/packages/*.apk \
            out/packages/SHA256SUMS \
            out/packages/BUILD_INFO.txt \
            out/*.tar.gz \
            --clobber

          echo
          echo "============================================================"
          echo "Release published successfully"
          echo "${RELEASE_TAG}"
          echo "============================================================"
