name: Build OpenAppFilter for ImmortalWrt x86_64

on:
  workflow_dispatch:
    inputs:
      immortalwrt_version:
        description: '选择 ImmortalWrt 源码版本'
        required: true
        default: 'v25.12.2'
        type: choice
        options:
          - openwrt-25.12
          - v25.12.0
          - v25.12.1
          - v25.12.2
          - v25.12.3
          - v25.12.4
          - v25.12.5
          - v25.12.6

permissions:
  contents: write

env:
  IMMORTALWRT_REPO: https://github.com/immortalwrt/immortalwrt.git
  OAF_REPO: https://github.com/destan19/OpenAppFilter.git

jobs:
  build:
    name: OAF ${{ inputs.immortalwrt_version }} x86_64
    runs-on: ubuntu-24.04

    steps:
      # ============================================================
      # Checkout Builder Repository
      # ============================================================

      - name: Checkout
        uses: actions/checkout@v4

      # ============================================================
      # Free disk space
      # ============================================================

      - name: Free disk space
        shell: bash
        run: |
          set -euxo pipefail

          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /opt/hostedtoolcache/CodeQL || true

          echo
          df -h

      # ============================================================
      # Install ImmortalWrt build dependencies
      #
      # genisoimage provides /usr/bin/mkisofs on Ubuntu.
      # ============================================================

      - name: Install build dependencies
        shell: bash
        run: |
          set -euxo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            ack \
            antlr3 \
            asciidoc \
            autoconf \
            automake \
            autopoint \
            binutils \
            bison \
            build-essential \
            bzip2 \
            ccache \
            clang \
            cmake \
            cpio \
            curl \
            device-tree-compiler \
            ecj \
            fastjar \
            flex \
            gawk \
            gettext \
            gcc-multilib \
            g++-multilib \
            git \
            libgnutls28-dev \
            gperf \
            haveged \
            help2man \
            intltool \
            libc6-dev-i386 \
            libelf-dev \
            libglib2.0-dev \
            libgmp-dev \
            libltdl-dev \
            libmpc-dev \
            libmpfr-dev \
            libncurses-dev \
            libpython3-dev \
            libreadline-dev \
            libssl-dev \
            libtool \
            libyaml-dev \
            lld \
            llvm \
            lrzsz \
            genisoimage \
            msmtp \
            ninja-build \
            p7zip-full \
            patch \
            pkgconf \
            python3 \
            python3-pip \
            python3-ply \
            python3-docutils \
            python3-pyelftools \
            qemu-utils \
            re2c \
            rsync \
            scons \
            squashfs-tools \
            subversion \
            swig \
            texinfo \
            uglifyjs \
            unzip \
            wget \
            xmlto \
            xxd \
            zlib1g-dev \
            zstd

          echo
          echo "========== mkisofs =========="
          command -v mkisofs
          mkisofs --version || true
          echo "============================="

      # ============================================================
      # Validate ImmortalWrt branch / tag
      #
      # openwrt-25.12 -> branch
      # v25.12.x     -> tag
      #
      # Future options may remain in the menu.
      # If the tag does not exist yet, stop immediately.
      # ============================================================

      - name: Validate ImmortalWrt ref
        id: iwrt_ref
        shell: bash
        env:
          IWRT_REF: ${{ inputs.immortalwrt_version }}
        run: |
          set -euxo pipefail

          echo "Selected ref: ${IWRT_REF}"

          if [[ "${IWRT_REF}" == v* ]]; then

            echo "Checking tag ${IWRT_REF} ..."

            if ! git ls-remote \
              --exit-code \
              --tags \
              "${IMMORTALWRT_REPO}" \
              "refs/tags/${IWRT_REF}" \
              >/dev/null 2>&1; then

              echo
              echo "============================================================"
              echo "ERROR: ImmortalWrt tag does not exist:"
              echo "${IWRT_REF}"
              echo "============================================================"
              exit 1
            fi

            RELEASE="${IWRT_REF#v}"

            echo "type=tag" >> "${GITHUB_OUTPUT}"
            echo "release=${RELEASE}" >> "${GITHUB_OUTPUT}"

          else

            echo "Checking branch ${IWRT_REF} ..."

            if ! git ls-remote \
              --exit-code \
              --heads \
              "${IMMORTALWRT_REPO}" \
              "refs/heads/${IWRT_REF}" \
              >/dev/null 2>&1; then

              echo
              echo "============================================================"
              echo "ERROR: ImmortalWrt branch does not exist:"
              echo "${IWRT_REF}"
              echo "============================================================"
              exit 1
            fi

            echo "type=branch" >> "${GITHUB_OUTPUT}"
            echo "release=${IWRT_REF}" >> "${GITHUB_OUTPUT}"

          fi

          echo
          echo "ImmortalWrt ref is valid."

      # ============================================================
      # Clone selected ImmortalWrt source
      # ============================================================

      - name: Clone ImmortalWrt
        id: iwrt
        shell: bash
        env:
          IWRT_REF: ${{ inputs.immortalwrt_version }}
        run: |
          set -euxo pipefail

          git clone \
            --depth 1 \
            --single-branch \
            --filter=blob:none \
            --branch "${IWRT_REF}" \
            "${IMMORTALWRT_REPO}" \
            immortalwrt

          cd immortalwrt

          IWRT_COMMIT="$(git rev-parse HEAD)"
          IWRT_SHORT="$(git rev-parse --short=8 HEAD)"

          echo
          echo "============================================================"
          echo "ImmortalWrt"
          echo "============================================================"
          echo "Ref:    ${IWRT_REF}"
          echo "Commit: ${IWRT_COMMIT}"
          echo "============================================================"

          echo "ref=${IWRT_REF}" >> "${GITHUB_OUTPUT}"
          echo "commit=${IWRT_COMMIT}" >> "${GITHUB_OUTPUT}"
          echo "short_commit=${IWRT_SHORT}" >> "${GITHUB_OUTPUT}"

      # ============================================================
      # Update / install feeds
      # ============================================================

      - name: Update and install feeds
        shell: bash
        working-directory: immortalwrt
        run: |
          set -euxo pipefail

          ./scripts/feeds update -a
          ./scripts/feeds install -a

      # ============================================================
      # Remove ImmortalWrt built-in OpenAppFilter
      #
      # ImmortalWrt packages feed contains its own:
      #
      #   kmod-oaf
      #   appfilter
      #
      # Leaving it together with destan19/OpenAppFilter results in
      # duplicate package definitions / recursive Kconfig dependencies.
      # ============================================================

      - name: Remove built-in OpenAppFilter
        shell: bash
        working-directory: immortalwrt
        run: |
          set -euxo pipefail

          echo "Removing ImmortalWrt built-in OpenAppFilter..."

          rm -rf feeds/packages/net/open-app-filter
          rm -rf package/feeds/packages/open-app-filter

          # Remove old ImmortalWrt LuCI frontend if present.
          rm -rf feeds/luci/applications/luci-app-appfilter
          rm -rf package/feeds/luci/luci-app-appfilter

          # Remove generated package metadata cache.
          rm -rf tmp

          echo
          echo "Built-in OpenAppFilter removed."

      # ============================================================
      # Resolve latest stable OpenAppFilter tag
      #
      # Only accept:
      #
      #   v7.0.1
      #   v7.0.2
      #   v7.1.0
      #
      # Ignore master / beta / rc / test tags.
      # ============================================================

      - name: Resolve latest OpenAppFilter tag
        id: oaf
        shell: bash
        run: |
          set -euxo pipefail

          OAF_TAG="$(
            git ls-remote \
              --tags \
              --refs \
              "${OAF_REPO}" \
              'refs/tags/v*' \
            | sed 's#.*refs/tags/##' \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
            | sort -V \
            | tail -n 1
          )"

          if [ -z "${OAF_TAG}" ]; then
            echo "ERROR: Unable to find OpenAppFilter stable tag."
            exit 1
          fi

          if ! git ls-remote \
            --exit-code \
            --tags \
            "${OAF_REPO}" \
            "refs/tags/${OAF_TAG}" \
            >/dev/null 2>&1; then

            echo "ERROR: Invalid OpenAppFilter tag: ${OAF_TAG}"
            exit 1
          fi

          echo
          echo "============================================================"
          echo "Latest OpenAppFilter tag: ${OAF_TAG}"
          echo "============================================================"

          echo "tag=${OAF_TAG}" >> "${GITHUB_OUTPUT}"

      # ============================================================
      # Clone latest stable OpenAppFilter
      # ============================================================

      - name: Clone OpenAppFilter
        id: oaf_source
        shell: bash
        working-directory: immortalwrt
        env:
          OAF_TAG: ${{ steps.oaf.outputs.tag }}
        run: |
          set -euxo pipefail

          rm -rf package/OpenAppFilter

          git clone \
            --depth 1 \
            --single-branch \
            --branch "${OAF_TAG}" \
            "${OAF_REPO}" \
            package/OpenAppFilter

          OAF_COMMIT="$(
            git -C package/OpenAppFilter rev-parse HEAD
          )"

          OAF_SHORT="$(
            git -C package/OpenAppFilter rev-parse --short=8 HEAD
          )"

          echo
          echo "============================================================"
          echo "OpenAppFilter"
          echo "============================================================"
          echo "Tag:    ${OAF_TAG}"
          echo "Commit: ${OAF_COMMIT}"
          echo "============================================================"

          echo "commit=${OAF_COMMIT}" >> "${GITHUB_OUTPUT}"
          echo "short_commit=${OAF_SHORT}" >> "${GITHUB_OUTPUT}"

      # ============================================================
      # Verify duplicate package definitions are gone
      # ============================================================

      - name: Check OAF package conflicts
        shell: bash
        working-directory: immortalwrt
        run: |
          set -euo pipefail

          echo
          echo "========== KernelPackage/oaf =========="

          KMOD_FILES="$(
            grep -Rsl \
              --include='Makefile' \
              'define KernelPackage/oaf' \
              package feeds \
              2>/dev/null \
              || true
          )"

          printf '%s\n' "${KMOD_FILES}"

          KMOD_COUNT="$(
            printf '%s\n' "${KMOD_FILES}" \
              | sed '/^$/d' \
              | wc -l
          )"

          echo "Count: ${KMOD_COUNT}"

          if [ "${KMOD_COUNT}" -ne 1 ]; then
            echo
            echo "ERROR: KernelPackage/oaf definition count must be 1."
            exit 1
          fi

          echo
          echo "========== Package/appfilter =========="

          APP_FILES="$(
            grep -Rsl \
              --include='Makefile' \
              'define Package/appfilter' \
              package feeds \
              2>/dev/null \
              || true
          )"

          printf '%s\n' "${APP_FILES}"

          APP_COUNT="$(
            printf '%s\n' "${APP_FILES}" \
              | sed '/^$/d' \
              | wc -l
          )"

          echo "Count: ${APP_COUNT}"

          if [ "${APP_COUNT}" -ne 1 ]; then
            echo
            echo "ERROR: Package/appfilter definition count must be 1."
            exit 1
          fi

      # ============================================================
      # Fixed ImmortalWrt release tag:
      #
      # Download official x86/64 config.buildinfo.
      #
      # This gives us the official release kernel configuration
      # instead of generating an unrelated custom config.
      # ============================================================

      - name: Load official x86_64 config
        if: steps.iwrt_ref.outputs.type == 'tag'
        shell: bash
        working-directory: immortalwrt
        env:
          RELEASE: ${{ steps.iwrt_ref.outputs.release }}
        run: |
          set -euxo pipefail

          CONFIG_URL="https://downloads.immortalwrt.org/releases/${RELEASE}/targets/x86/64/config.buildinfo"

          echo "Downloading:"
          echo "${CONFIG_URL}"

          if ! curl \
            -fL \
            --retry 5 \
            --retry-delay 3 \
            -o .config \
            "${CONFIG_URL}"; then

            echo
            echo "============================================================"
            echo "ERROR: Official x86/64 config.buildinfo does not exist."
            echo
            echo "ImmortalWrt tag: v${RELEASE}"
            echo
            echo "The source tag may exist before official x86/64"
            echo "release files have been published."
            echo "============================================================"
            exit 1
          fi

          test -s .config

          echo
          echo "Official x86/64 config loaded."

      # ============================================================
      # Rolling openwrt-25.12 branch:
      #
      # No immutable release config exists, so use generic x86_64.
      # ============================================================

      - name: Configure rolling x86_64 branch
        if: steps.iwrt_ref.outputs.type == 'branch'
        shell: bash
        working-directory: immortalwrt
        run: |
          set -euxo pipefail

          cat > .config <<'EOF'
          CONFIG_TARGET_x86=y
          CONFIG_TARGET_x86_64=y
          CONFIG_TARGET_x86_64_DEVICE_generic=y
          EOF

      # ============================================================
      # Configure OAF exactly as upstream documentation recommends:
      #
      # CONFIG_PACKAGE_luci-app-oaf=y
      #
      # make defconfig automatically enables:
      #
      # CONFIG_PACKAGE_appfilter=y
      # CONFIG_PACKAGE_kmod-oaf=y
      # ============================================================

      - name: Configure OpenAppFilter
        shell: bash
        working-directory: immortalwrt
        run: |
          set -euxo pipefail

          # Remove old/current OAF selections from config first.
          sed -i -E \
            '/^(# )?CONFIG_PACKAGE_(kmod-oaf|appfilter|luci-app-appfilter|luci-app-oaf|luci-i18n-appfilter[^= ]*|luci-i18n-oaf[^= ]*)(=| is not set)/d' \
            .config || true

          # Official OpenAppFilter configuration method.
          echo "CONFIG_PACKAGE_luci-app-oaf=y" >> .config

          # Force package metadata regeneration after replacing OAF.
          rm -rf tmp

          make defconfig 2>&1 | tee /tmp/oaf-defconfig.log

          # make defconfig can sometimes print Kconfig errors while
          # still leaving a generated .config, so explicitly reject it.
          if grep -q "recursive dependency detected" /tmp/oaf-defconfig.log; then
            echo
            echo "============================================================"
            echo "ERROR: recursive Kconfig dependency detected."
            echo "============================================================"
            exit 1
          fi

          echo
          echo "============================================================"
          echo "OpenAppFilter configuration"
          echo "============================================================"

          grep -E \
            '^CONFIG_PACKAGE_(kmod-oaf|appfilter|luci-app-oaf)=' \
            .config \
            || true

          echo "============================================================"

          # Upstream says selecting luci-app-oaf enables all 3.
          grep -q '^CONFIG_PACKAGE_luci-app-oaf=y$' .config
          grep -q '^CONFIG_PACKAGE_appfilter=y$' .config
          grep -q '^CONFIG_PACKAGE_kmod-oaf=y$' .config

      # ============================================================
      # Show final target configuration
      # ============================================================

      - name: Show build configuration
        shell: bash
        working-directory: immortalwrt
        run: |
          set -euo pipefail

          echo
          echo "================ TARGET ================="

          grep -E \
            '^(CONFIG_TARGET_x86|CONFIG_TARGET_x86_64|CONFIG_TARGET_x86_64_DEVICE_generic)=' \
            .config \
            || true

          echo
          echo "================ OAF ===================="

          grep -E \
            '^CONFIG_PACKAGE_(kmod-oaf|appfilter|luci-app-oaf)=' \
            .config

          echo
          echo "========================================="

      # ============================================================
      # Build host tools
      # ============================================================

      - name: Build tools
        shell: bash
        working-directory: immortalwrt
        run: |
          set -o pipefail

          make \
            tools/install \
            -j"$(nproc)" \
            V=s \
            2>&1 | tee "${GITHUB_WORKSPACE}/tools.log"

      # ============================================================
      # Build cross toolchain
      # ============================================================

      - name: Build toolchain
        shell: bash
        working-directory: immortalwrt
        run: |
          set -o pipefail

          make \
            toolchain/install \
            -j"$(nproc)" \
            V=s \
            2>&1 | tee "${GITHUB_WORKSPACE}/toolchain.log"

      # ============================================================
      # Prepare/build kernel
      #
      # OAF contains oaf.ko, therefore the kernel build environment
      # and Module.symvers must exist before compiling kmod-oaf.
      # ============================================================

      - name: Build kernel environment
        shell: bash
        working-directory: immortalwrt
        run: |
          set -o pipefail

          make \
            target/linux/compile \
            -j"$(nproc)" \
            V=s \
            2>&1 | tee "${GITHUB_WORKSPACE}/kernel.log"

      # ============================================================
      # Detect actual built kernel information
      #
      # Informational only; do not fail merely because .vermagic
      # location changes in a future ImmortalWrt release.
      # ============================================================

      - name: Detect kernel information
        id: kernel
        shell: bash
        working-directory: immortalwrt
        run: |
          set -euxo pipefail

          KERNEL_DIR="$(
            find build_dir \
              -type d \
              -path '*/linux-x86_64/linux-[0-9]*' \
              2>/dev/null \
              | head -n 1 \
              || true
          )"

          if [ -n "${KERNEL_DIR}" ]; then
            KERNEL_VERSION="$(basename "${KERNEL_DIR}")"
            KERNEL_VERSION="${KERNEL_VERSION#linux-}"
          else
            KERNEL_VERSION="unknown"
          fi

          VERMAGIC_FILE="$(
            find build_dir \
              -type f \
              -name '.vermagic' \
              2>/dev/null \
              | head -n 1 \
              || true
          )"

          if [ -n "${VERMAGIC_FILE}" ]; then
            KERNEL_VERMAGIC="$(cat "${VERMAGIC_FILE}")"
          else
            KERNEL_VERMAGIC="unknown"
          fi

          echo
          echo "============================================================"
          echo "Kernel version : ${KERNEL_VERSION}"
          echo "Kernel vermagic: ${KERNEL_VERMAGIC}"
          echo "============================================================"

          echo "version=${KERNEL_VERSION}" >> "${GITHUB_OUTPUT}"
          echo "vermagic=${KERNEL_VERMAGIC}" >> "${GITHUB_OUTPUT}"

      # ============================================================
      # Build OAF
      #
      # Use the exact package targets documented by upstream.
      #
      # All three packages will be generated:
      #
      #   luci-app-oaf
      #   appfilter
      #   kmod-oaf
      # ============================================================

      - name: Build luci-app-oaf
        shell: bash
        working-directory: immortalwrt
        run: |
          set -o pipefail

          make \
            package/luci-app-oaf/compile \
            -j"$(nproc)" \
            V=s \
            2>&1 | tee "${GITHUB_WORKSPACE}/luci-app-oaf.log"

      - name: Build appfilter
        shell: bash
        working-directory: immortalwrt
        run: |
          set -o pipefail

          make \
            package/open-app-filter/compile \
            -j"$(nproc)" \
            V=s \
            2>&1 | tee "${GITHUB_WORKSPACE}/open-app-filter.log"

      - name: Build kmod-oaf
        shell: bash
        working-directory: immortalwrt
        run: |
          set -o pipefail

          make \
            package/oaf/compile \
            -j"$(nproc)" \
            V=s \
            2>&1 | tee "${GITHUB_WORKSPACE}/oaf.log"

      # ============================================================
      # Collect generated APK packages
      # ============================================================

      - name: Collect OpenAppFilter packages
        id: collect
        shell: bash
        working-directory: immortalwrt
        env:
          IWRT_REF: ${{ steps.iwrt.outputs.ref }}
          IWRT_COMMIT: ${{ steps.iwrt.outputs.short_commit }}

          OAF_TAG: ${{ steps.oaf.outputs.tag }}
          OAF_COMMIT: ${{ steps.oaf_source.outputs.short_commit }}

          KERNEL_VERSION: ${{ steps.kernel.outputs.version }}
          KERNEL_VERMAGIC: ${{ steps.kernel.outputs.vermagic }}
        run: |
          set -euxo pipefail

          OUT="${GITHUB_WORKSPACE}/out"
          PKG="${OUT}/packages"

          rm -rf "${OUT}"
          mkdir -p "${PKG}"

          # --------------------------------------------------------
          # kmod-oaf
          # --------------------------------------------------------

          find bin \
            -type f \
            -name 'kmod-oaf*.apk' \
            -exec cp -v {} "${PKG}/" \;

          # --------------------------------------------------------
          # appfilter
          # --------------------------------------------------------

          find bin \
            -type f \
            -name 'appfilter*.apk' \
            -exec cp -v {} "${PKG}/" \;

          # --------------------------------------------------------
          # luci-app-oaf
          # --------------------------------------------------------

          find bin \
            -type f \
            -name 'luci-app-oaf*.apk' \
            -exec cp -v {} "${PKG}/" \;

          # --------------------------------------------------------
          # Optional LuCI translation packages
          # --------------------------------------------------------

          find bin \
            -type f \
            -name 'luci-i18n-oaf-*.apk' \
            -exec cp -v {} "${PKG}/" \;

          echo
          echo "============================================================"
          echo "Generated OpenAppFilter packages"
          echo "============================================================"

          ls -lh "${PKG}"

          echo "============================================================"

          # --------------------------------------------------------
          # Verify all 3 core APKs exist.
          # --------------------------------------------------------

          if ! compgen -G "${PKG}/kmod-oaf*.apk" >/dev/null; then
            echo "ERROR: kmod-oaf APK was not generated."
            exit 1
          fi

          if ! compgen -G "${PKG}/appfilter*.apk" >/dev/null; then
            echo "ERROR: appfilter APK was not generated."
            exit 1
          fi

          if ! compgen -G "${PKG}/luci-app-oaf*.apk" >/dev/null; then
            echo "ERROR: luci-app-oaf APK was not generated."
            exit 1
          fi

          # --------------------------------------------------------
          # Generate SHA256SUMS
          # --------------------------------------------------------

          (
            cd "${PKG}"
            sha256sum *.apk > SHA256SUMS
          )

          SAFE_IWRT_REF="$(
            printf '%s' "${IWRT_REF}" \
              | tr '/' '-'
          )"

          # --------------------------------------------------------
          # Build information
          # --------------------------------------------------------

          cat > "${PKG}/BUILD_INFO.txt" <<EOF
          OpenAppFilter for ImmortalWrt
          ============================================================

          OpenAppFilter tag:
          ${OAF_TAG}

          OpenAppFilter commit:
          ${OAF_COMMIT}

          ------------------------------------------------------------

          ImmortalWrt ref:
          ${IWRT_REF}

          ImmortalWrt commit:
          ${IWRT_COMMIT}

          Target:
          x86/64

          ------------------------------------------------------------

          Kernel version:
          ${KERNEL_VERSION}

          Kernel vermagic:
          ${KERNEL_VERMAGIC}

          ------------------------------------------------------------

          Core packages:

          kmod-oaf
          appfilter
          luci-app-oaf

          ------------------------------------------------------------

          OpenAppFilter:
          https://github.com/destan19/OpenAppFilter

          ImmortalWrt:
          https://github.com/immortalwrt/immortalwrt
          EOF

          # --------------------------------------------------------
          # Create archive
          # --------------------------------------------------------

          ARCHIVE_NAME="immortalwrt-${SAFE_IWRT_REF}-oaf-${OAF_TAG}-x86_64-kernel_${KERNEL_VERSION}"

          tar \
            -C "${PKG}" \
            -czf "${OUT}/${ARCHIVE_NAME}.tar.gz" \
            .

          echo "archive_name=${ARCHIVE_NAME}" >> "${GITHUB_OUTPUT}"
          echo "safe_iwrt_ref=${SAFE_IWRT_REF}" >> "${GITHUB_OUTPUT}"

      # ============================================================
      # Upload GitHub Actions Artifact
      #
      # Contains all 3 OAF APKs.
      # ============================================================

      - name: Upload Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.collect.outputs.archive_name }}
          path: |
            out/packages/*.apk
            out/packages/SHA256SUMS
            out/packages/BUILD_INFO.txt
            out/*.tar.gz
          if-no-files-found: error
          retention-days: 30

      # ============================================================
      # Prepare GitHub Release tag
      #
      # ImmortalWrt commit is included intentionally.
      #
      # For openwrt-25.12:
      # branch moves -> new commit -> new Release.
      #
      # For v25.12.x:
      # tag is fixed -> reproducible Release identifier.
      # ============================================================

      - name: Prepare GitHub Release
        id: release
        shell: bash
        env:
          IWRT_REF: ${{ steps.iwrt.outputs.ref }}
          IWRT_COMMIT: ${{ steps.iwrt.outputs.short_commit }}
          OAF_TAG: ${{ steps.oaf.outputs.tag }}
        run: |
          set -euxo pipefail

          SAFE_IWRT_REF="$(
            printf '%s' "${IWRT_REF}" \
              | tr '/' '-'
          )"

          RELEASE_TAG="oaf-${OAF_TAG}-immortalwrt-${SAFE_IWRT_REF}-${IWRT_COMMIT}-x86_64"

          echo "tag=${RELEASE_TAG}" >> "${GITHUB_OUTPUT}"

          echo
          echo "Release tag:"
          echo "${RELEASE_TAG}"

      # ============================================================
      # Create / update GitHub Release
      #
      # Re-running exactly the same source versions overwrites
      # existing assets using --clobber.
      # ============================================================

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}

          RELEASE_TAG: ${{ steps.release.outputs.tag }}

          IWRT_REF: ${{ steps.iwrt.outputs.ref }}
          IWRT_COMMIT: ${{ steps.iwrt.outputs.commit }}

          OAF_TAG: ${{ steps.oaf.outputs.tag }}
          OAF_COMMIT: ${{ steps.oaf_source.outputs.commit }}

          KERNEL_VERSION: ${{ steps.kernel.outputs.version }}
          KERNEL_VERMAGIC: ${{ steps.kernel.outputs.vermagic }}
        run: |
          set -euxo pipefail

          RELEASE_NAME="OAF ${OAF_TAG} - ImmortalWrt ${IWRT_REF} - x86_64"

          cat > "${GITHUB_WORKSPACE}/release-notes.md" <<EOF
          ## OpenAppFilter

          - Tag: \`${OAF_TAG}\`
          - Commit: \`${OAF_COMMIT}\`

          ## ImmortalWrt

          - Ref: \`${IWRT_REF}\`
          - Commit: \`${IWRT_COMMIT}\`
          - Target: \`x86/64\`

          ## Kernel

          - Version: \`${KERNEL_VERSION}\`
          - Vermagic: \`${KERNEL_VERMAGIC}\`

          ## Packages

          本 Release 同时包含：

          - \`kmod-oaf\`
          - \`appfilter\`
          - \`luci-app-oaf\`

          如果构建系统生成对应语言包，也会一并上传
          \`luci-i18n-oaf-*.apk\`。

          > \`kmod-oaf\` 与当前构建所使用的 ImmortalWrt Kernel ABI
          > 绑定，请勿安装到 Kernel ABI 不一致的系统。

          ## Source

          OpenAppFilter:
          https://github.com/destan19/OpenAppFilter

          ImmortalWrt:
          https://github.com/immortalwrt/immortalwrt
          EOF

          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then

            echo "Release already exists. Updating..."

            gh release edit \
              "${RELEASE_TAG}" \
              --title "${RELEASE_NAME}" \
              --notes-file "${GITHUB_WORKSPACE}/release-notes.md"

          else

            echo "Creating Release..."

            gh release create \
              "${RELEASE_TAG}" \
              --title "${RELEASE_NAME}" \
              --notes-file "${GITHUB_WORKSPACE}/release-notes.md"

          fi

          gh release upload \
            "${RELEASE_TAG}" \
            out/packages/*.apk \
            out/packages/SHA256SUMS \
            out/packages/BUILD_INFO.txt \
            out/*.tar.gz \
            --clobber

          echo
          echo "============================================================"
          echo "GitHub Release published successfully"
          echo
          echo "Tag:"
          echo "${RELEASE_TAG}"
          echo "============================================================"
